<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「慈濟一甲子・感恩里長情」茶會出席回覆單</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Google 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f6f5f0;
            color: #2c3e50;
        }
        .font-serif-tc {
            font-family: 'Noto Serif TC', serif;
        }
        .card-bg {
            background: linear-gradient(to bottom, #ffffff, #fcfbf9);
            border: 1px solid #e6dec5;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // 表單連動與欄位狀態
            const [selectedDistrict, setSelectedDistrict] = React.useState("");
            const [selectedVillage, setSelectedVillage] = React.useState("");
            const [transportMode, setTransportMode] = React.useState("");

            // 輸入欄位與驗證狀態
            const [name, setName] = React.useState("");
            const [phone, setPhone] = React.useState("");
            const [carPlate, setCarPlate] = React.useState("");

            const [nameError, setNameError] = React.useState("");
            const [phoneError, setPhoneError] = React.useState("");
            const [carPlateError, setCarPlateError] = React.useState("");

            // 完整對應 Google 表單的里別資料庫
            const districtVillages = {
                "三重區": [
                    "二重里", "三重里", "三安里", "三和里", "三民里", "大同里", "大安里", "大有里", "大園里", "大智里", 
                    "大德里", "中山里", "中興里", "中正里", "中央里", "中民里", "介壽里", "正安里", "正義里", "正德里", 
                    "民生里", "永安里", "永春里", "永順里", "永德里", "永盛里", "永吉里", "永豐里", "永福里", "永清里", 
                    "永興里", "光正里", "光榮里", "光輝里", "光明里", "光華里", "光復里", "光田里", "光陽里", "成功里", 
                    "自強里", "秀江里", "谷王里", "五谷里", "和平里", "平和里", "長安里", "長生里", "長元里", "長泰里", 
                    "長江里", "長福里", "厚德里", "德厚里", "重陽里", "重興里", "重明里", "開元里", "福安里", "福德里", 
                    "福民里", "福田里", "福星里", "福隆里", "福利里", "福祉里", "福樂里", "慈化里", "慈生里", "慈惠里", 
                    "慈愛里", "慈福里", "慈祐里", "錦田里", "錦安里", "錦通里", "錦江里", "六合里", "五常里", "五福里", 
                    "五華里", "五順里", "仁忠里", "仁義里", "仁德里", "仁華里", "文化里", "同安里", "同慶里", "安慶里", 
                    "田中里", "田心里", "田安里", "吉利里", "富華里", "富福里", "富貴里", "瑞德里", "興華里", "龍濱里", 
                    "龍門里", "雙園里", "碧華里", "溪美里", "菜寮里", "過田里", "頂崁里", "博愛里", "幸福里", "信義里", 
                    "信安里", "清和里", "重新里", "新義里", "自由里", "國隆里", "朝陽里", "奕壽里", "萬壽里"
                ],
                "蘆洲區": [
                    "九芎里", "中華里", "中興里", "中路里", "仁愛里", "仁義里", "水湳里", "正義里", "永安里", "永康里", 
                    "永德里", "光華里", "光明里", "成功里", "延平里", "忠義里", "長安里", "保佑里", "保新里", "保華里", 
                    "信義里", "恒德里", "玉清里", "南港里", "溪墘里", "復興里", "得仁里", "得勝里", "街口里", "樓厝里", 
                    "樹德里", "橘井里", "福安里", "水南里", "功德里", "湧蓮里", "鷺江里", "關懷里"
                ],
                "五股區": [
                    "民義里", "五股里", "五福里", "六福里", "五龍里", "集福里", "集賢里", "成州里", "成功里", "成泰里", 
                    "成德里", "觀音里", "德音里", "德泰里", "福德里", "陸一里", "水碓里", "貿商里", "興珍里", "更寮里", "芳洲里"
                ]
            };

            // 🔗 官方 Google 表單對應設定
            const GOOGLE_FORM_ACTION = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSc9JeeRlbW0WuHfqHvzXtDFoF93E_zTgoPmuwj99oNmWD9mJw/formResponse";
            
            const formEntries = {
                district: "entry.696777273",   // 行政區
                attendance: "entry.1009888297",// 出席狀況
                name: "entry.702390885",       // 出席者姓名
                phone: "entry.1503687082",     // 聯絡電話
                totalPeople: "entry.570526933",// 出席總人數
                transport: "entry.1794182272", // 前往交通方式
                carPlate: "entry.1669492461"   // 汽車車牌號碼
            };

            // 根據所選行政區取得對應的 Google 表單 entry ID
            const getVillageEntryName = () => {
                if (selectedDistrict === "蘆洲區") return "entry.2102008597";
                if (selectedDistrict === "五股區") return "entry.1628460829";
                return "entry.2136849777"; // 預設三重區
            };

            // 姓名即時驗證
            const handleNameChange = (e) => {
                const val = e.target.value;
                setName(val);
                if (val.trim().length === 0) {
                    setNameError('請輸入出席者姓名');
                } else if (val.trim().length < 2) {
                    setNameError('姓名請至少輸入 2 個字元');
                } else {
                    setNameError('');
                }
            };

            // 電話格式驗證（只能是純數字，必須以 09 開頭共 10 碼）
            const handlePhoneChange = (e) => {
                const val = e.target.value.replace(/\D/g, ''); // 過濾非數字
                setPhone(val);
                
                if (val.length === 0) {
                    setPhoneError('請輸入聯絡電話');
                } else if (!val.startsWith('09')) {
                    setPhoneError('聯絡電話必須以 09 開頭（不接受市話）');
                } else if (val.length !== 10) {
                    setPhoneError(`手機號碼需為 10 碼（目前 ${val.length} 碼）`);
                } else {
                    setPhoneError('');
                }
            };

            // 車牌格式驗證（自動轉大寫，符合台灣車牌）
            const handleCarPlateChange = (e) => {
                const val = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
                setCarPlate(val);
                const plateRegex = /^([A-Z0-9]{2,4}-?[A-Z0-9]{2,4})$/;

                if (transportMode === "自行開車") {
                    if (val.trim().length === 0) {
                        setCarPlateError('請輸入汽車車牌號碼');
                    } else if (!plateRegex.test(val) || val.length < 5 || val.length > 8) {
                        setCarPlateError('車牌格式有誤（例：ABC-1234 或 ABC1234）');
                    } else {
                        setCarPlateError('');
                    }
                } else {
                    setCarPlateError('');
                }
            };

            // 提交按鈕點擊驗證
            const handleSubmit = (e) => {
                let hasError = false;
                if (!name.trim() || nameError) hasError = true;
                if (!phone.trim() || phoneError) hasError = true;
                if (transportMode === "自行開車" && (!carPlate.trim() || carPlateError)) hasError = true;

                if (hasError) {
                    e.preventDefault();
                    alert('請檢查輸入欄位（姓名、電話、車牌等）格式是否正確完整。');
                    return;
                }
                // 若驗證通過，表單將直接送往 Google 試算表寫入
            };

            return (
                <div className="min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex flex-col items-center justify-center">
                    <div className="max-w-xl w-full card-bg rounded-2xl shadow-xl overflow-hidden p-6 sm:p-10 relative">
                        
                        {/* 標題與說明區 */}
                        <div className="text-center mb-8 border-b border-amber-900/10 pb-6">
                            <h1 className="font-serif-tc text-3xl sm:text-4xl font-bold text-[#162955] tracking-wide mb-4">
                                「慈濟一甲子・感恩里長情」茶會出席回覆單
                            </h1>
                            <div className="text-sm sm:text-base text-gray-700 leading-relaxed px-2 text-justify sm:text-center space-y-2">
                                <p>感恩各里里長長年對三重慈濟園區的疼惜與護持。適逢慈濟成立一甲子（60年），特備清茶與茶食，誠摯邀請各位里長蒞臨相聚，共敘情誼。</p>
                                <div className="bg-[#f4efe4]/60 border border-amber-900/20 rounded-xl p-4 text-sm text-gray-800 space-y-1.5 text-left mt-3">
                                    <div>🔹 <b>日期：</b>2026年9月7日（星期一）</div>
                                    <div>🔹 <b>報到時間：</b>下午 1:30</div>
                                    <div>🔹 <b>活動時間：</b>下午 2:00 ～ 4:00</div>
                                    <div>🔹 <b>地點：</b>三重慈濟園區・國議廳</div>
                                </div>
                                <p className="pt-2 text-xs text-amber-900/80 font-medium">懇請填寫下方資訊回覆出席狀況，以利現場清茶與座位安排，感恩！</p>
                            </div>
                        </div>

                        {/* 表單主體 */}
                        <div>
                            <div className="mb-6 text-center">
                                <h2 className="font-serif-tc text-lg font-bold text-[#162955]">請填寫以下回覆資訊</h2>
                                <p className="text-xs text-red-500 mt-1">* 表示必填問題</p>
                            </div>

                            <form 
                                action={GOOGLE_FORM_ACTION} 
                                method="POST" 
                                onSubmit={handleSubmit}
                                className="space-y-6"
                            >
                                {/* 1. 行政區 */}
                                <div>
                                    <label className="block text-sm font-medium text-[#162955] mb-1">
                                        行政區 <span className="text-red-500">*</span>
                                    </label>
                                    <select 
                                        name={formEntries.district} 
                                        value={selectedDistrict}
                                        onChange={(e) => {
                                            setSelectedDistrict(e.target.value);
                                            setSelectedVillage("");
                                        }}
                                        required 
                                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#162955] focus:outline-none bg-white text-sm"
                                    >
                                        <option value="">選擇</option>
                                        <option value="三重區">三重區</option>
                                        <option value="五股區">五股區</option>
                                        <option value="蘆洲區">蘆洲區</option>
                                    </select>
                                </div>

                                {/* 2. 里別 (動態連動) */}
                                <div>
                                    <label className="block text-sm font-medium text-[#162955] mb-1">
                                        {selectedDistrict ? selectedDistrict : "里別"} <span className="text-red-500">*</span>
                                    </label>
                                    <select 
                                        name={getVillageEntryName()} 
                                        value={selectedVillage}
                                        onChange={(e) => setSelectedVillage(e.target.value)}
                                        required 
                                        disabled={!selectedDistrict}
                                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#162955] focus:outline-none bg-white text-sm disabled:bg-gray-100 disabled:cursor-not-allowed"
                                    >
                                        <option value="">{selectedDistrict ? "選擇" : "請先選擇行政區"}</option>
                                        {selectedDistrict && districtVillages[selectedDistrict]?.map((village, idx) => (
                                            <option key={idx} value={village}>{village}</option>
                                        ))}
                                    </select>
                                </div>

                                {/* 3. 出席狀況 */}
                                <div>
                                    <label className="block text-sm font-medium text-[#162955] mb-2">
                                        出席狀況 <span className="text-red-500">*</span>
                                    </label>
                                    <div className="space-y-2">
                                        {["里長親自出席", "委派代表出席", "不克出席"].map((status, idx) => (
                                            <label key={idx} className="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-amber-50 text-sm transition">
                                                <input type="radio" name={formEntries.attendance} value={status} required className="mr-3 text-[#162955] focus:ring-[#162955]" /> 
                                                {status}
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                {/* 4. 出席者姓名 */}
                                <div>
                                    <label className="block text-sm font-medium text-[#162955] mb-1">
                                        出席者姓名 <span className="text-xs text-gray-500">(若為代表出席，請填寫代表人姓名。)</span> <span className="text-red-500">*</span>
                                    </label>
                                    <input 
                                        type="text" 
                                        name={formEntries.name} 
                                        value={name}
                                        onChange={handleNameChange}
                                        required 
                                        placeholder="請輸入真實姓名" 
                                        className={`w-full px-4 py-2.5 rounded-lg border focus:ring-2 focus:outline-none bg-white text-sm ${nameError ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-[#162955]'}`}
                                    />
                                    {nameError && <p className="text-xs text-red-500 mt-1">{nameError}</p>}
                                </div>

                                {/* 5. 聯絡電話 */}
                                <div>
                                    <label className="block text-sm font-medium text-[#162955] mb-1">
                                        聯絡電話 (行動電話) <span className="text-red-500">*</span>
                                    </label>
                                    <input 
                                        type="tel" 
                                        maxLength="10"
                                        name={formEntries.phone} 
                                        value={phone}
                                        onChange={handlePhoneChange}
                                        required 
                                        placeholder="請輸入 09 開頭的手機號碼（例：0912345678）" 
                                        className={`w-full px-4 py-2.5 rounded-lg border focus:ring-2 focus:outline-none bg-white text-sm ${phoneError ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-[#162955]'}`}
                                    />
                                    {phoneError && <p className="text-xs text-red-500 mt-1">{phoneError}</p>}
                                </div>

                                {/* 6. 出席總人數 */}
                                <div>
                                    <label className="block text-sm font-medium text-[#162955] mb-2">
                                        出席總人數（含里長/代表） <span className="text-red-500">*</span>
                                    </label>
                                    <div className="space-y-2">
                                        {["1 人", "2 人", "3 人", "4 人以上", "0 人（不克出席）"].map((num, idx) => (
                                            <label key={idx} className="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-amber-50 text-sm transition">
                                                <input type="radio" name={formEntries.totalPeople} value={num} required className="mr-3 text-[#162955] focus:ring-[#162955]" /> 
                                                {num}
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                {/* 7. 前往交通方式 */}
                                <div>
                                    <label className="block text-sm font-medium text-[#162955] mb-2">
                                        前往交通方式 <span className="text-red-500">*</span>
                                    </label>
                                    <div className="space-y-2">
                                        {["自行開車", "騎乘機車", "搭乘大眾運輸 / 步行"].map((mode, idx) => (
                                            <label key={idx} className="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-amber-50 text-sm transition">
                                                <input 
                                                    type="radio" 
                                                    name={formEntries.transport} 
                                                    value={mode} 
                                                    onChange={(e) => setTransportMode(e.target.value)}
                                                    required 
                                                    className="mr-3 text-[#162955] focus:ring-[#162955]" 
                                                /> 
                                                {mode}
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                {/* 8. 汽車車牌號碼 */}
                                {transportMode === "自行開車" && (
                                    <div className="bg-amber-50/50 p-4 rounded-xl border border-amber-200">
                                        <label className="block text-sm font-medium text-[#162955] mb-1">
                                            汽車車牌號碼 <span className="text-red-500">*</span>
                                        </label>
                                        <input 
                                            type="text" 
                                            name={formEntries.carPlate} 
                                            value={carPlate}
                                            onChange={handleCarPlateChange}
                                            required 
                                            placeholder="例：ABC-1234（以利園區安排車位）" 
                                            className={`w-full px-4 py-2.5 rounded-lg border focus:ring-2 focus:outline-none bg-white text-sm ${carPlateError ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-[#162955]'}`}
                                        />
                                        {carPlateError && <p className="text-xs text-red-500 mt-1">{carPlateError}</p>}
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    className="w-full py-3.5 px-4 bg-[#162955] hover:bg-[#112044] text-white font-medium rounded-xl shadow-lg transition duration-200 tracking-wider text-base mt-4"
                                >
                                    提交
                                </button>
                            </form>
                        </div>

                        <div className="text-center mt-8 pt-4 border-t border-amber-900/10 text-xs text-gray-500">
                            佛教慈濟慈善事業基金會 三重園區
                        </div>

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

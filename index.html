<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「慈濟一甲子・感恩里長情」茶會出席回覆單</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Google 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f6f5f0;
            color: #2c3e50;
        }
        .font-serif-tc {
            font-family: 'Noto Serif TC', serif;
        }
        .card-bg {
            background: linear-gradient(to bottom, #ffffff, #fcfbf9);
            border: 1px solid #e6dec5;
        }
        /* 自訂單選按鈕顏色 */
        input[type="radio"]:checked {
            accent-color: #162955;
        }
        
        /* 載入動畫 */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // ⚠️ 請替換為您部署的 Google Apps Script (Web App) 網址
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw35doPYI6rGEyh1lGROiDAkUKFpQam3yT6Y7UvS-qANpBAxlevLwD6iw3cbDzGAgcq/exec'; // 這裡先放您之前提供的網址作為範例，請務必更換成新試算表部署的網址

        function App() {
            const [submitted, setSubmitted] = React.useState(false);
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const [globalError, setGlobalError] = React.useState("");
            
            // 表單欄位狀態
            const [selectedDistrict, setSelectedDistrict] = React.useState("");
            const [selectedVillage, setSelectedVillage] = React.useState("");
            const [attendance, setAttendance] = React.useState("");
            const [name, setName] = React.useState("");
            const [phone, setPhone] = React.useState("");
            const [totalPeople, setTotalPeople] = React.useState("");
            const [transportMode, setTransportMode] = React.useState("");
            const [carPlate, setCarPlate] = React.useState("");

            // 錯誤訊息狀態
            const [nameError, setNameError] = React.useState("");
            const [phoneError, setPhoneError] = React.useState("");
            const [carPlateError, setCarPlateError] = React.useState("");

            const districtVillages = {
                "三重區": [
                    "二重里", "三重里", "三安里", "三和里", "三民里", "大同里", "大安里", "大有里", "大園里", "大智里", 
                    "大德里", "中山里", "中興里", "中正里", "中央里", "中民里", "介壽里", "正安里", "正義里", "正德里", 
                    "民生里", "永安里", "永春里", "永順里", "永德里", "永盛里", "永吉里", "永豐里", "永福里", "永清里", 
                    "永興里", "光正里", "光榮里", "光輝里", "光明里", "光華里", "光復里", "光田里", "光陽里", "成功里", 
                    "自強里", "秀江里", "谷王里", "五谷里", "和平里", "平和里", "長安里", "長生里", "長元里", "長泰里", 
                    "長江里", "長福里", "厚德里", "德厚里", "重陽里", "重興里", "重明里", "開元里", "福安里", "福德里", 
                    "福民里", "福田里", "福星里", "福隆里", "福利里", "福祉里", "福樂里", "慈化里", "慈生里", "慈惠里", 
                    "慈愛里", "慈福里", "慈祐里", "錦田里", "錦安里", "錦通里", "錦江里", "六合里", "五常里", "五福里", 
                    "五華里", "五順里", "仁忠里", "仁義里", "仁德里", "仁華里", "文化里", "同安里", "同慶里", "安慶里", 
                    "田中里", "田心里", "田安里", "吉利里", "富華里", "富福里", "富貴里", "瑞德里", "興華里", "龍濱里", 
                    "龍門里", "雙園里", "碧華里", "溪美里", "菜寮里", "過田里", "頂崁里", "博愛里", "幸福里", "信義里", 
                    "信安里", "清和里", "重新里", "新義里", "自由里", "國隆里", "朝陽里", "奕壽里", "萬壽里"
                ],
                "蘆洲區": [
                    "九芎里", "中華里", "中興里", "中路里", "仁愛里", "仁義里", "水湳里", "正義里", "永安里", "永康里", 
                    "永德里", "光華里", "光明里", "成功里", "延平里", "忠義里", "長安里", "保佑里", "保新里", "保華里", 
                    "信義里", "恒德里", "玉清里", "南港里", "溪墘里", "復興里", "得仁里", "得勝里", "街口里", "樓厝里", 
                    "樹德里", "橘井里", "福安里", "水南里", "功德里", "湧蓮里", "鷺江里", "關懷里"
                ],
                "五股區": [
                    "民義里", "五股里", "五福里", "六福里", "五龍里", "集福里", "集賢里", "成州里", "成功里", "成泰里", 
                    "成德里", "觀音里", "德音里", "德泰里", "福德里", "陸一里", "水碓里", "貿商里", "興珍里", "更寮里", "芳洲里"
                ]
            };

            const handleNameChange = (e) => {
                const val = e.target.value;
                setName(val);
                if (val.trim().length === 0) {
                    setNameError('請輸入出席者姓名');
                } else if (val.trim().length < 2) {
                    setNameError('姓名請至少輸入 2 個字元');
                } else {
                    setNameError('');
                }
            };

            const handlePhoneChange = (e) => {
                const val = e.target.value.replace(/\D/g, ''); // 僅保留純數字
                setPhone(val);
                
                if (val.length === 0) {
                    setPhoneError('請輸入聯絡電話');
                } else if (!val.startsWith('09')) {
                    setPhoneError('聯絡電話必須以 09 開頭（不接受市話）');
                } else if (val.length !== 10) {
                    setPhoneError(`手機號碼需為 10 碼（目前 ${val.length} 碼）`);
                } else {
                    setPhoneError('');
                }
            };

            const handleCarPlateChange = (e) => {
                const val = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
                setCarPlate(val);
                const plateRegex = /^([A-Z0-9]{2,4}-?[A-Z0-9]{2,4})$/;

                if (val.trim().length === 0) {
                    setCarPlateError('請輸入汽車車牌號碼');
                } else if (!plateRegex.test(val) || val.length < 5 || val.length > 8) {
                    setCarPlateError('車牌格式有誤（例：ABC-1234 或 ABC1234）');
                } else {
                    setCarPlateError('');
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setGlobalError("");

                // 前端再次驗證
                if (!selectedDistrict || !selectedVillage || !attendance || !totalPeople || !transportMode) {
                    setGlobalError("請確認所有必填欄位皆已選擇。");
                    return;
                }
                if (nameError || phoneError || (transportMode === "自行開車" && carPlateError) || !name || !phone || (transportMode === "自行開車" && !carPlate)) {
                    setGlobalError("請修正欄位格式錯誤。");
                    return;
                }

                setIsSubmitting(true);

                // 準備傳送給 GAS 的 JSON 資料
                const submitData = {
                    district: selectedDistrict,
                    village: selectedVillage,
                    attendance: attendance,
                    name: name,
                    phone: phone,
                    totalPeople: totalPeople,
                    transportMode: transportMode,
                    carPlate: transportMode === "自行開車" ? carPlate : "" 
                };

                try {
                    // 使用 fetch 以 JSON 格式 POST 給 Google Apps Script
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(submitData)
                    });
                    
                    const result = await response.json();
                    
                    if(result.status === 'Success') {
                        setIsSubmitting(false);
                        setSubmitted(true);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        throw new Error(result.message || '回傳狀態錯誤');
                    }

                } catch (error) {
                    console.error('提交錯誤:', error);
                    setIsSubmitting(false);
                    setGlobalError("提交失敗，請檢查網路連線或稍後再試。");
                }
            };

            return (
                <div className="min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex flex-col items-center justify-center">
                    <div className="max-w-xl w-full card-bg rounded-2xl shadow-xl overflow-hidden p-6 sm:p-10 relative border-t-[6px] border-t-[#162955]">
                        
                        <div className="text-center mb-8 border-b border-amber-900/10 pb-6">
                            <h1 className="font-serif-tc text-3xl sm:text-4xl font-bold text-[#162955] tracking-wide mb-4">
                                「慈濟一甲子・感恩里長情」茶會出席回覆單
                            </h1>
                            <div className="text-sm sm:text-base text-gray-700 leading-relaxed px-2 text-justify sm:text-center space-y-2">
                                <p>感恩各里里長長年對三重慈濟園區的疼惜與護持。適逢慈濟成立一甲子（60年），特備清茶與茶食，誠摯邀請各位里長蒞臨相聚，共敘情誼。</p>
                                <div className="bg-[#f4efe4]/60 border border-amber-900/20 rounded-xl p-4 text-sm text-gray-800 space-y-1.5 text-left mt-3 shadow-inner">
                                    <div>🔹 <b>日期：</b>2026年9月7日（星期一）</div>
                                    <div>🔹 <b>報到時間：</b>下午 1:30</div>
                                    <div>🔹 <b>活動時間：</b>下午 2:00 ～ 4:00</div>
                                    <div>🔹 <b>地點：</b>三重慈濟園區・國議廳</div>
                                </div>
                                <p className="pt-2 text-xs text-amber-900/80 font-medium">懇請填寫下方資訊回覆出席狀況，以利現場清茶與座位安排，感恩！</p>
                            </div>
                        </div>

                        {!submitted ? (
                            <div>
                                <div className="mb-6">
                                    <p className="text-xs text-red-500">* 必填</p>
                                </div>

                                <form onSubmit={handleSubmit} className="space-y-7">
                                    {/* 1. 行政區 */}
                                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                                        <label className="block text-[15px] font-medium text-gray-800 mb-3">
                                            行政區 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="space-y-3">
                                            {["三重區", "蘆洲區", "五股區"].map((dist) => (
                                                <label key={dist} className="flex items-center cursor-pointer group">
                                                    <input 
                                                        type="radio" 
                                                        value={dist} 
                                                        checked={selectedDistrict === dist}
                                                        onChange={(e) => {
                                                            setSelectedDistrict(e.target.value);
                                                            setSelectedVillage("");
                                                        }}
                                                        className="w-4 h-4 text-[#162955] border-gray-300 focus:ring-[#162955] cursor-pointer"
                                                    />
                                                    <span className="ml-3 text-sm text-gray-700 group-hover:text-black">{dist}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 2. 里別 */}
                                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                                        <label className="block text-[15px] font-medium text-gray-800 mb-3">
                                            {selectedDistrict ? selectedDistrict : "里別"} <span className="text-red-500">*</span>
                                        </label>
                                        <select 
                                            value={selectedVillage}
                                            onChange={(e) => setSelectedVillage(e.target.value)}
                                            disabled={!selectedDistrict}
                                            className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#162955] focus:outline-none bg-white text-sm disabled:bg-gray-50 disabled:cursor-not-allowed transition"
                                        >
                                            <option value="">{selectedDistrict ? "請選擇里別" : "請先選擇上方的行政區"}</option>
                                            {selectedDistrict && districtVillages[selectedDistrict]?.map((village, idx) => (
                                                <option key={idx} value={village}>{village}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* 3. 出席狀況 */}
                                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                                        <label className="block text-[15px] font-medium text-gray-800 mb-3">
                                            出席狀況 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="space-y-3">
                                            {["里長親自出席", "委派代表出席", "不克出席"].map((status) => (
                                                <label key={status} className="flex items-center cursor-pointer group">
                                                    <input 
                                                        type="radio" 
                                                        value={status} 
                                                        checked={attendance === status}
                                                        onChange={(e) => setAttendance(e.target.value)}
                                                        className="w-4 h-4 text-[#162955] border-gray-300 focus:ring-[#162955] cursor-pointer"
                                                    />
                                                    <span className="ml-3 text-sm text-gray-700 group-hover:text-black">{status}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 4. 姓名 */}
                                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                                        <label className="block text-[15px] font-medium text-gray-800 mb-1">
                                            出席者姓名 <span className="text-red-500">*</span>
                                        </label>
                                        <p className="text-xs text-gray-500 mb-3">若為代表出席，請填寫代表人姓名。</p>
                                        <input 
                                            type="text" 
                                            value={name}
                                            onChange={handleNameChange}
                                            placeholder="您的回答" 
                                            className={`w-full px-4 py-2.5 rounded-lg border focus:ring-2 focus:outline-none bg-white text-sm transition ${nameError ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-[#162955]'}`}
                                        />
                                        {nameError && <p className="text-xs text-red-500 mt-2 flex items-center"><span className="mr-1">⚠️</span>{nameError}</p>}
                                    </div>

                                    {/* 5. 電話 */}
                                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                                        <label className="block text-[15px] font-medium text-gray-800 mb-3">
                                            聯絡電話 (行動電話) <span className="text-red-500">*</span>
                                        </label>
                                        <input 
                                            type="tel" 
                                            maxLength="10"
                                            value={phone}
                                            onChange={handlePhoneChange}
                                            placeholder="您的回答" 
                                            className={`w-full px-4 py-2.5 rounded-lg border focus:ring-2 focus:outline-none bg-white text-sm transition ${phoneError ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-[#162955]'}`}
                                        />
                                        {phoneError && <p className="text-xs text-red-500 mt-2 flex items-center"><span className="mr-1">⚠️</span>{phoneError}</p>}
                                    </div>

                                    {/* 6. 人數 */}
                                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                                        <label className="block text-[15px] font-medium text-gray-800 mb-3">
                                            出席總人數（含里長/代表） <span className="text-red-500">*</span>
                                        </label>
                                        <div className="space-y-3">
                                            {["1 人", "2 人", "3 人", "4 人以上", "0 人（不克出席）"].map((num) => (
                                                <label key={num} className="flex items-center cursor-pointer group">
                                                    <input 
                                                        type="radio" 
                                                        value={num} 
                                                        checked={totalPeople === num}
                                                        onChange={(e) => setTotalPeople(e.target.value)}
                                                        className="w-4 h-4 text-[#162955] border-gray-300 focus:ring-[#162955] cursor-pointer"
                                                    />
                                                    <span className="ml-3 text-sm text-gray-700 group-hover:text-black">{num}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 7. 交通 */}
                                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                                        <label className="block text-[15px] font-medium text-gray-800 mb-3">
                                            前往交通方式 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="space-y-3">
                                            {["自行開車", "騎乘機車", "搭乘大眾運輸 / 步行"].map((mode) => (
                                                <label key={mode} className="flex items-center cursor-pointer group">
                                                    <input 
                                                        type="radio" 
                                                        value={mode} 
                                                        checked={transportMode === mode}
                                                        onChange={(e) => setTransportMode(e.target.value)}
                                                        className="w-4 h-4 text-[#162955] border-gray-300 focus:ring-[#162955] cursor-pointer" 
                                                    />
                                                    <span className="ml-3 text-sm text-gray-700 group-hover:text-black">{mode}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 8. 車牌 */}
                                    {transportMode === "自行開車" && (
                                        <div className="bg-[#fcfaf5] p-5 rounded-xl border border-amber-200 shadow-sm animate-fade-in">
                                            <label className="block text-[15px] font-medium text-[#162955] mb-1">
                                                汽車車牌號碼 <span className="text-red-500">*</span>
                                            </label>
                                            <input 
                                                type="text" 
                                                value={carPlate}
                                                onChange={handleCarPlateChange}
                                                placeholder="例：ABC-1234 (以利園區安排車位)" 
                                                className={`w-full px-4 py-2.5 mt-2 rounded-lg border focus:ring-2 focus:outline-none bg-white text-sm transition ${carPlateError ? 'border-red-400 focus:ring-red-400' : 'border-amber-300 focus:ring-[#162955]'}`}
                                            />
                                            {carPlateError && <p className="text-xs text-red-500 mt-2 flex items-center"><span className="mr-1">⚠️</span>{carPlateError}</p>}
                                        </div>
                                    )}

                                    {/* 錯誤提示與提交 */}
                                    {globalError && (
                                        <div className="p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm font-medium text-center">
                                            {globalError}
                                        </div>
                                    )}

                                    <button 
                                        type="submit" 
                                        disabled={isSubmitting}
                                        className="w-full py-3.5 px-4 bg-[#162955] hover:bg-[#1f3770] disabled:bg-[#162955]/70 text-white font-medium rounded-xl shadow-md transition duration-200 tracking-wider text-base mt-2 flex justify-center items-center"
                                    >
                                        {isSubmitting ? (
                                            <><span className="spinner"></span> 正在送出回覆...</>
                                        ) : "提交"}
                                    </button>
                                </form>
                            </div>
                        ) : (
                            <div className="text-center py-12 space-y-4">
                                <div className="w-16 h-16 bg-green-50 border border-green-200 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-sm">
                                    ✓
                                </div>
                                <h3 className="font-serif-tc text-2xl font-bold text-[#162955]">感恩您的回覆</h3>
                                <p className="text-gray-600 text-sm max-w-sm mx-auto">
                                    您的出席回覆已順利送出。<br/>三重慈濟園區期待與您共敘一甲子之情！
                                </p>
                                <button 
                                    onClick={() => {
                                        setSubmitted(false);
                                        // 清空表單
                                        setSelectedDistrict("");
                                        setSelectedVillage("");
                                        setAttendance("");
                                        setName("");
                                        setPhone("");
                                        setTotalPeople("");
                                        setTransportMode("");
                                        setCarPlate("");
                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                    }} 
                                    className="mt-6 px-6 py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm rounded-lg transition"
                                >
                                    填寫其他回覆
                                </button>
                            </div>
                        )}

                        <div className="text-center mt-10 pt-4 border-t border-amber-900/10 text-xs text-gray-500 tracking-wide">
                            佛教慈濟慈善事業基金會 三重園區
                        </div>

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

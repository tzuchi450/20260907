<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慈濟一甲子·感恩里長情 出席回覆表單</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts Noto Serif TC & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .serif-title {
            font-family: 'Noto Serif TC', serif;
        }
        /* 典雅金線框裝飾 */
        .gold-border-box {
            border: 1.5px solid #d4af37;
            position: relative;
        }
        .gold-border-box::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            pointer-events: none;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);
            
            // 表單欄位狀態 (對應 Google 表單欄位名稱)
            const [formData, setFormData] = useState({
                name: '',
                title: '', // 里別/職稱
                phone: '',
                attendance: '參加',
                vegetarian: '素食',
                notes: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                setLoading(true);
                // 模擬非同步送出至 Google Form 隱藏 iframe
                setTimeout(() => {
                    setLoading(false);
                    setSubmitted(true);
                }, 1000);
            };

            return (
                <div className="flex flex-col min-h-screen justify-between py-6 px-4 sm:px-6">
                    <div className="max-w-2xl w-full mx-auto space-y-8">
                        
                        {/* 邀請函主視覺風格卡片 */}
                        <div className="bg-[#fcfbf9] text-slate-800 rounded-3xl shadow-2xl p-6 sm:p-10 border border-[#e2dcd0] relative overflow-hidden">
                            
                            {/* 水墨浮水印裝飾 */}
                            <div className="absolute top-0 right-0 opacity-15 pointer-events-none transform translate-x-8 -translate-y-8">
                                <svg width="220" height="220" viewBox="0 0 200 200" fill="#1e3a8a">
                                    <path d="M100 20C120 60 180 80 180 100C180 120 120 140 100 180C80 140 20 120 20 100C20 80 80 60 100 20Z" />
                                </svg>
                            </div>

                            {/* 頂部標語 */}
                            <div className="text-center space-y-2 mb-8">
                                <div className="inline-flex items-center space-x-3 text-xs sm:text-sm tracking-widest text-[#1e3a8a] font-medium uppercase">
                                    <span className="h-[1px] w-8 bg-[#d4af37]"></span>
                                    <span>感恩相聚 · 清茶傳情</span>
                                    <span className="h-[1px] w-8 bg-[#d4af37]"></span>
                                </div>
                                <h1 className="serif-title text-3xl sm:text-4xl font-bold tracking-wider text-[#162955]">
                                    慈濟一甲子 · 感恩里長情
                                </h1>
                                <div className="text-[#d4af37] text-xl">🪷</div>
                            </div>

                            {/* 內文簡介與活動資訊 */}
                            <div className="bg-[#f7f5ef] rounded-2xl p-5 sm:p-6 mb-8 border border-[#e8e2d2] text-sm sm:text-base leading-relaxed text-slate-700 space-y-4">
                                <p className="text-justify">
                                    感恩三重區各里里長，長年對三重慈濟園區的疼惜與護持。適逢慈濟成立一甲子（60年），特備清茶與茶食，誠摯邀請各位里長蒞臨相聚，共敘情誼。
                                </p>

                                {/* 活動細節清單 */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 text-sm text-[#162955] font-medium">
                                    <div className="flex items-center space-x-3 bg-white/70 p-3 rounded-xl border border-[#e8e2d2]">
                                        <span className="text-lg">📅</span>
                                        <div>
                                            <p className="text-xs text-slate-500">日期</p>
                                            <p>2026年9月7日 (星期一)</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-3 bg-white/70 p-3 rounded-xl border border-[#e8e2d2]">
                                        <span className="text-lg">⏰</span>
                                        <div>
                                            <p className="text-xs text-slate-500">時間</p>
                                            <p>下午 2:00 ~ 4:00 (1:30 報到)</p>
                                        </div>
                                    </div>
                                    <div className="col-span-1 sm:col-span-2 flex items-center space-x-3 bg-white/70 p-3 rounded-xl border border-[#e8e2d2]">
                                        <span className="text-lg">📍</span>
                                        <div>
                                            <p className="text-xs text-slate-500">地點</p>
                                            <p>三重慈濟園區 · 國議廳</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 填寫表單區塊 */}
                            <div className="bg-white rounded-2xl shadow-sm border border-[#e8e2d2] p-6 sm:p-8">
                                <div className="border-b border-slate-100 pb-4 mb-6">
                                    <h2 className="serif-title text-xl font-bold text-[#162955]">
                                        ✍️ 出席回覆與問卷填寫
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-1">
                                        懇請回覆是否出席，以利統籌安排席次與茶點。
                                    </p>
                                </div>

                                {!submitted ? (
                                    <form 
                                        action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSc...您的Google表單ID.../formResponse" 
                                        method="POST" 
                                        target="hidden_iframe"
                                        onSubmit={handleSubmit}
                                        className="space-y-6"
                                    >
                                        {/* 姓名欄位 */}
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">
                                                里長 / 貴賓姓名 <span className="text-rose-500">*</span>
                                            </label>
                                            <input 
                                                type="text" 
                                                name="entry.123456789" 
                                                required 
                                                value={formData.name}
                                                onChange={handleChange}
                                                placeholder="請輸入您的真實姓名" 
                                                className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#162955] focus:outline-none transition bg-slate-50/50"
                                            />
                                        </div>

                                        {/* 里別或職稱 */}
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">
                                                里別 / 服務單位 <span className="text-rose-500">*</span>
                                            </label>
                                            <input 
                                                type="text" 
                                                name="entry.234567890" 
                                                required 
                                                value={formData.title}
                                                onChange={handleChange}
                                                placeholder="例：三重區福德里 / 某某單位" 
                                                className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#162955] focus:outline-none transition bg-slate-50/50"
                                            />
                                        </div>

                                        {/* 聯絡電話 */}
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">
                                                聯絡電話 <span className="text-rose-500">*</span>
                                            </label>
                                            <input 
                                                type="tel" 
                                                name="entry.345678901" 
                                                required 
                                                value={formData.phone}
                                                onChange={handleChange}
                                                placeholder="例：0912-345678" 
                                                className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#162955] focus:outline-none transition bg-slate-50/50"
                                            />
                                        </div>

                                        {/* 出席意願單選題 */}
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-2">
                                                出席意願 <span className="text-rose-500">*</span>
                                            </label>
                                            <div className="grid grid-cols-2 gap-4">
                                                <label className={`flex items-center justify-center p-3.5 rounded-xl border cursor-pointer transition text-sm ${formData.attendance === '參加' ? 'border-[#162955] bg-[#162955]/5 text-[#162955] font-bold shadow-sm' : 'border-slate-200 hover:bg-slate-50 text-slate-600'}`}>
                                                    <input 
                                                        type="radio" 
                                                        name="entry.456789012" 
                                                        value="參加" 
                                                        checked={formData.attendance === '參加'}
                                                        onChange={handleChange}
                                                        className="mr-2 accent-[#162955]"
                                                    />
                                                    🌿 感恩，歡喜參加
                                                </label>
                                                <label className={`flex items-center justify-center p-3.5 rounded-xl border cursor-pointer transition text-sm ${formData.attendance === '不克參加' ? 'border-[#162955] bg-[#162955]/5 text-[#162955] font-bold shadow-sm' : 'border-slate-200 hover:bg-slate-50 text-slate-600'}`}>
                                                    <input 
                                                        type="radio" 
                                                        name="entry.456789012" 
                                                        value="不克參加" 
                                                        checked={formData.attendance === '不克參加'}
                                                        onChange={handleChange}
                                                        className="mr-2 accent-[#162955]"
                                                    />
                                                    ☁️ 祝福，不克參加
                                                </label>
                                            </div>
                                        </div>

                                        {/* 齋戒葷素選項 */}
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-2">
                                                飲食習慣 (蔬食護生茶點)
                                            </label>
                                            <div className="grid grid-cols-2 gap-4">
                                                <label className={`flex items-center justify-center p-3.5 rounded-xl border cursor-pointer transition text-sm ${formData.vegetarian === '素食' ? 'border-[#162955] bg-[#162955]/5 text-[#162955] font-bold shadow-sm' : 'border-slate-200 hover:bg-slate-50 text-slate-600'}`}>
                                                    <input 
                                                        type="radio" 
                                                        name="entry.567890123" 
                                                        value="素食" 
                                                        checked={formData.vegetarian === '素食'}
                                                        onChange={handleChange}
                                                        className="mr-2 accent-[#162955]"
                                                    />
                                                    🥗 精緻蔬食 (素)
                                                </label>
                                                <label className={`flex items-center justify-center p-3.5 rounded-xl border cursor-pointer transition text-sm ${formData.vegetarian === '葷食' ? 'border-[#162955] bg-[#162955]/5 text-[#162955] font-bold shadow-sm' : 'border-slate-200 hover:bg-slate-50 text-slate-600'}`}>
                                                    <input 
                                                        type="radio" 
                                                        name="entry.567890123" 
                                                        value="葷食" 
                                                        checked={formData.vegetarian === '葷食'}
                                                        onChange={handleChange}
                                                        className="mr-2 accent-[#162955]"
                                                    />
                                                    🍱 一般飲食
                                                </label>
                                            </div>
                                        </div>

                                        {/* 備註與祝福語 */}
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">
                                                感恩迴向 / 建議事項
                                            </label>
                                            <textarea 
                                                name="entry.678901234" 
                                                rows="3"
                                                value={formData.notes}
                                                onChange={handleChange}
                                                placeholder="若有其他特別需求，請在此留言..."
                                                className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#162955] focus:outline-none transition bg-slate-50/50"
                                            ></textarea>
                                        </div>

                                        {/* 提交按鈕 */}
                                        <button 
                                            type="submit" 
                                            disabled={loading}
                                            className="w-full bg-[#162955] hover:bg-[#101e3d] text-white font-medium py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center space-x-2 tracking-wider"
                                        >
                                            {loading ? (
                                                <span>資料傳送中...</span>
                                            ) : (
                                                <span>確認無誤，送出回覆 🙏</span>
                                            )}
                                        </button>
                                    </form>
                                ) : (
                                    <div className="text-center py-12 space-y-4">
                                        <div className="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner border border-emerald-100">
                                            ✓
                                        </div>
                                        <h2 className="serif-title text-2xl font-bold text-[#162955]">感恩您的回覆與護持！</h2>
                                        <p className="text-slate-600 max-w-sm mx-auto text-sm leading-relaxed">
                                            您的出席資料已成功送出。誠摯期盼在 9 月 7 日與您在三重慈濟園區相見，祝福您吉祥如意。
                                        </p>
                                        <button 
                                            onClick={() => setSubmitted(false)}
                                            className="mt-6 px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition text-sm"
                                        >
                                            修改或填寫另一筆
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* 底部裝飾與結語 */}
                            <div className="text-center pt-6 text-sm text-[#162955] font-medium tracking-widest">
                                <span>企 盼 您 的 蒞 臨</span>
                            </div>

                        </div>

                        {/* 隱藏的 iframe 用於接收 Google 表單 POST，防止頁面跳轉 */}
                        <iframe name="hidden_iframe" id="hidden_iframe" style={{display: 'none'}}></iframe>
                    </div>

                    {/* 頁尾版權 */}
                    <footer className="text-center py-6 text-xs text-slate-500">
                        <p>© 2026 佛教慈濟基金會三重園區 • 虔誠祈招平安社會祥和</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

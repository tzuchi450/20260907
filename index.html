<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「慈濟一甲子・感恩里長情」茶會出席回覆單</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Google 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 經典信箋點狀背景 */
            background-color: #f6f5f0;
            background-image: radial-gradient(#d5c39a 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2c3e50;
        }
        .font-serif-tc {
            font-family: 'Noto Serif TC', serif;
        }
        .card-bg {
            background-color: #ffffff;
            /* 典雅金邊框 */
            border: 2px solid #dcb871;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        /* 客製化輸入框：選中時呈現慈濟金黃色光暈 */
        .custom-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .custom-input:focus {
            outline: none;
            border-color: #dcb871;
            box-shadow: 0 0 0 3px rgba(220, 184, 113, 0.2);
        }
        /* 單選框特效 */
        .radio-card {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }
        .radio-card:hover {
            background-color: #fcfbf9;
            border-color: #dcb871;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [submitted, setSubmitted] = React.useState(false);
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            
            // 表單狀態
            const [selectedDistrict, setSelectedDistrict] = React.useState("");
            const [selectedVillage, setSelectedVillage] = React.useState("");
            const [transportMode, setTransportMode] = React.useState("");

            const districtVillages = {
                "三重區": ["二重里", "三重里", "三安里", "三和里", "三民里", "大同里", "大安里", "大有里", "大園里", "大智里", "大德里", "中山里", "中興里", "中正里", "中央里", "中民里", "介壽里", "正安里", "正義里", "正德里", "民生里", "永安里", "永春里", "永順里", "永德里", "永盛里", "永吉里", "永豐里", "永福里", "永清里", "永興里", "光正里", "光榮里", "光輝里", "光明里", "光華里", "光復里", "光田里", "光陽里", "成功里", "自強里", "秀江里", "谷王里", "五谷里", "和平里", "平和里", "長安里", "長生里", "長元里", "長泰里", "長江里", "長福里", "厚德里", "德厚里", "重陽里", "重興里", "重明里", "開元里", "福安里", "福德里", "福民里", "福田里", "福星里", "福隆里", "福利里", "福祉里", "福樂里", "慈化里", "慈生里", "慈惠里", "慈愛里", "慈福里", "慈祐里", "錦田里", "錦安里", "錦通里", "錦江里", "六合里", "五常里", "五福里", "五華里", "五順里", "仁忠里", "仁義里", "仁德里", "仁華里", "文化里", "同安里", "同慶里", "安慶里", "田中里", "田心里", "田安里", "吉利里", "富華里", "富福里", "富貴里", "瑞德里", "興華里", "龍濱里", "龍門里", "雙園里", "碧華里", "溪美里", "菜寮里", "過田里", "頂崁里", "博愛里", "幸福里", "信義里", "信安里", "清和里", "重新里", "新義里", "自由里", "國隆里", "朝陽里", "奕壽里", "萬壽里"],
                "蘆洲區": ["九芎里", "中華里", "中興里", "中路里", "仁愛里", "仁義里", "水湳里", "正義里", "永安里", "永康里", "永德里", "光華里", "光明里", "成功里", "延平里", "忠義里", "長安里", "保佑里", "保新里", "保華里", "信義里", "恒德里", "玉清里", "南港里", "溪墘里", "復興里", "得仁里", "得勝里", "街口里", "樓厝里", "樹德里", "橘井里", "福安里", "水南里", "功德里", "湧蓮里", "鷺江里", "關懷里"],
                "五股區": ["民義里", "五股里", "五福里", "六福里", "五龍里", "集福里", "集賢里", "成州里", "成功里", "成泰里", "成德里", "觀音里", "德音里", "德泰里", "福德里", "陸一里", "水碓里", "貿商里", "興珍里", "更寮里", "芳洲里"]
            };

            // ==============================================================
            // ⚠️ 請在這裡貼上您部署完成的 Google Apps Script 網址
            // ==============================================================
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw35doPYI6rGEyh1lGROiDAkUKFpQam3yT6Y7UvS-qANpBAxlevLwD6iw3cbDzGAgcq/exec"; 

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                // 🚨 嚴格前端驗證機制 🚨
                // 1. 姓名驗證：去除空白後必須至少 2 個字
                const nameCheck = data.name ? data.name.trim() : "";
                if (nameCheck.length < 2) {
                    alert("⚠️ 請輸入完整的出席者姓名（至少兩個字）。");
                    setIsSubmitting(false);
                    return;
                }

                // 2. 電話格式驗證：必須是 09 開頭，且剛好 10 碼數字
                const phoneCheck = data.phone ? data.phone.trim() : "";
                const phoneRegex = /^09\d{8}$/;
                if (!phoneRegex.test(phoneCheck)) {
                    alert("⚠️ 聯絡電話格式錯誤！\n請輸入 09 開頭共 10 碼的數字（不可包含 - 符號或市話）。");
                    setIsSubmitting(false);
                    return;
                }

                // 3. 車牌驗證：若選擇開車，必須填寫車牌
                if (data.transport === "自行開車") {
                    const carCheck = data.carPlate ? data.carPlate.trim() : "";
                    if (!carCheck) {
                        alert("⚠️ 既然選擇了「自行開車」，請務必填寫您的汽車車牌號碼以利安排車位。");
                        setIsSubmitting(false);
                        return;
                    }
                }

                // 若驗證全數通過，則送出資料
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify(data)
                    });
                    
                    const result = await response.json();
                    if (result.status === "Success") {
                        setSubmitted(true);
                    } else {
                        alert("❌ 提交失敗：" + (result.message || "未知錯誤"));
                    }
                } catch (error) {
                    alert("🌐 網路連線發生錯誤，請稍後再試。");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen py-8 px-4 sm:px-6 flex flex-col items-center justify-center">
                    <div className="max-w-xl w-full card-bg rounded-2xl p-6 sm:p-10 relative">
                        
                        {/* 標題與說明區 */}
                        <div className="text-center mb-8 border-b border-[#dcb871]/30 pb-6">
                            <h1 className="font-serif-tc text-3xl sm:text-4xl font-bold text-[#162955] tracking-wide mb-4">
                                「慈濟一甲子・感恩里長情」茶會
                            </h1>
                            <div className="text-sm sm:text-base text-gray-700 leading-relaxed text-justify sm:text-center space-y-2">
                                <p>感恩各里里長長年對三重慈濟園區的疼惜與護持。適逢慈濟成立一甲子（60年），特備清茶與茶食，誠摯邀請各位里長蒞臨相聚，共敘情誼。</p>
                                <div className="bg-[#fcfbf9] border border-[#dcb871]/50 rounded-xl p-4 text-sm text-gray-800 space-y-1.5 text-left mt-3">
                                    <div>🔹 <b className="text-[#162955]">日期：</b>2026年9月7日（星期一）</div>
                                    <div>🔹 <b className="text-[#162955]">報到時間：</b>下午 1:30</div>
                                    <div>🔹 <b className="text-[#162955]">活動時間：</b>下午 2:00 ～ 4:00</div>
                                    <div>🔹 <b className="text-[#162955]">地點：</b>三重慈濟園區・國議廳</div>
                                </div>
                                <p className="pt-2 text-xs text-amber-700 font-medium">懇請填寫下方資訊回覆出席狀況，以利現場清茶與座位安排，感恩！</p>
                            </div>
                        </div>

                        {/* 表單主體 */}
                        {!submitted ? (
                            <div>
                                <form onSubmit={handleSubmit} className="space-y-6">
                                    {/* 行政區 */}
                                    <div>
                                        <label className="block text-sm font-bold text-[#162955] mb-2">
                                            行政區 <span className="text-red-500">*</span>
                                        </label>
                                        <select 
                                            name="district" 
                                            value={selectedDistrict}
                                            onChange={(e) => {
                                                setSelectedDistrict(e.target.value);
                                                setSelectedVillage("");
                                            }}
                                            required 
                                            className="custom-input"
                                        >
                                            <option value="">選擇</option>
                                            <option value="三重區">三重區</option>
                                            <option value="五股區">五股區</option>
                                            <option value="蘆洲區">蘆洲區</option>
                                        </select>
                                    </div>

                                    {/* 里別 */}
                                    <div>
                                        <label className="block text-sm font-bold text-[#162955] mb-2">
                                            {selectedDistrict ? selectedDistrict : "里別"} <span className="text-red-500">*</span>
                                        </label>
                                        <select 
                                            name="village" 
                                            value={selectedVillage}
                                            onChange={(e) => setSelectedVillage(e.target.value)}
                                            required 
                                            disabled={!selectedDistrict}
                                            className="custom-input disabled:bg-gray-100 disabled:cursor-not-allowed"
                                        >
                                            <option value="">{selectedDistrict ? "選擇" : "請先選擇行政區"}</option>
                                            {selectedDistrict && districtVillages[selectedDistrict]?.map((village, idx) => (
                                                <option key={idx} value={village}>{village}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* 出席狀況 */}
                                    <div>
                                        <label className="block text-sm font-bold text-[#162955] mb-2">
                                            出席狀況 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="space-y-2">
                                            {["里長親自出席", "委派代表出席", "不克出席"].map((status, idx) => (
                                                <label key={idx} className="radio-card">
                                                    <input type="radio" name="attendance" value={status} required className="mr-3 w-4 h-4 accent-[#dcb871]" /> 
                                                    {status}
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 出席者姓名 */}
                                    <div className="bg-[#fcfbf9] p-4 rounded-xl border border-[#dcb871]/30">
                                        <label className="block text-sm font-bold text-[#162955] mb-1">
                                            出席者姓名 <span className="text-red-500">*</span>
                                        </label>
                                        <p className="text-xs text-gray-500 mb-2">若為代表出席，請填寫代表人姓名。</p>
                                        <input 
                                            type="text" 
                                            name="name" 
                                            placeholder="請輸入姓名" 
                                            className="custom-input"
                                        />
                                    </div>

                                    {/* 聯絡電話 */}
                                    <div className="bg-[#fcfbf9] p-4 rounded-xl border border-[#dcb871]/30">
                                        <label className="block text-sm font-bold text-[#162955] mb-1">
                                            聯絡電話 (行動電話) <span className="text-red-500">*</span>
                                        </label>
                                        <input 
                                            type="tel" 
                                            name="phone" 
                                            maxLength="10"
                                            placeholder="例如：0912345678 (限數字)" 
                                            onInput={(e) => e.target.value = e.target.value.replace(/[^\d]/g, '')}
                                            className="custom-input"
                                        />
                                    </div>

                                    {/* 出席總人數 */}
                                    <div>
                                        <label className="block text-sm font-bold text-[#162955] mb-2">
                                            出席總人數（含里長/代表） <span className="text-red-500">*</span>
                                        </label>
                                        <div className="space-y-2">
                                            {["1 人", "2 人", "3 人", "4 人以上", "0 人（不克出席）"].map((num, idx) => (
                                                <label key={idx} className="radio-card">
                                                    <input type="radio" name="totalPeople" value={num} required className="mr-3 w-4 h-4 accent-[#dcb871]" /> 
                                                    {num}
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 前往交通方式 */}
                                    <div>
                                        <label className="block text-sm font-bold text-[#162955] mb-2">
                                            前往交通方式 <span className="text-red-500">*</span>
                                        </label>
                                        <div className="space-y-2">
                                            {["自行開車", "騎乘機車", "搭乘大眾運輸 / 步行"].map((mode, idx) => (
                                                <label key={idx} className="radio-card">
                                                    <input 
                                                        type="radio" 
                                                        name="transport" 
                                                        value={mode} 
                                                        onChange={(e) => setTransportMode(e.target.value)}
                                                        required 
                                                        className="mr-3 w-4 h-4 accent-[#dcb871]" 
                                                    /> 
                                                    {mode}
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 汽車車牌號碼 */}
                                    {transportMode === "自行開車" && (
                                        <div className="bg-[#fdf9ef] p-4 rounded-xl border border-[#dcb871]">
                                            <label className="block text-sm font-bold text-[#162955] mb-1">
                                                汽車車牌號碼 <span className="text-red-500">*</span>
                                            </label>
                                            <p className="text-xs text-amber-700 mb-2">請輸入車牌以利園區安排車位</p>
                                            <input 
                                                type="text" 
                                                name="carPlate" 
                                                placeholder="例：ABC-1234" 
                                                style={{ textTransform: 'uppercase' }}
                                                onInput={(e) => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '')}
                                                className="custom-input"
                                            />
                                        </div>
                                    )}

                                    <button 
                                        type="submit" 
                                        disabled={isSubmitting}
                                        className="w-full py-4 px-4 bg-[#162955] hover:bg-[#0f1d3d] text-white font-bold rounded-xl shadow-lg transition duration-200 tracking-wider text-base mt-6 disabled:bg-gray-400"
                                    >
                                        {isSubmitting ? "正在傳送資料..." : "提交回覆"}
                                    </button>
                                </form>
                            </div>
                        ) : (
                            <div className="text-center py-12 space-y-4">
                                <div className="w-20 h-20 bg-[#fdf9ef] border-2 border-[#dcb871] text-[#dcb871] rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner">
                                    ✓
                                </div>
                                <h3 className="font-serif-tc text-2xl font-bold text-[#162955]">感恩您的回覆</h3>
                                <p className="text-gray-600 text-sm max-w-sm mx-auto">
                                    您的出席資料已順利送出。三重慈濟園區期待與您共敘一甲子之情！
                                </p>
                                <button 
                                    onClick={() => {
                                        setSubmitted(false);
                                        setTransportMode("");
                                    }} 
                                    className="mt-6 px-8 py-2.5 bg-gray-100 hover:bg-gray-200 text-[#162955] font-bold text-sm rounded-lg border border-gray-300 transition"
                                >
                                    填寫其他回覆
                                </button>
                            </div>
                        )}

                        <div className="text-center mt-10 pt-4 border-t border-[#dcb871]/30 text-xs text-gray-500">
                            佛教慈濟慈善事業基金會 三重園區
                        </div>

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
